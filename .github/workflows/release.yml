name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: streamlog-linux-x86_64
            lib_static: build/lib/libstreamlog.a
            lib_shared: build/lib/libstreamlog.so
          - os: macos-latest
            artifact_name: streamlog-macos-x86_64
            lib_static: build/lib/libstreamlog.a
            lib_shared: build/lib/libstreamlog.dylib

    steps:
    - uses: actions/checkout@v3

    - name: Build library
      run: |
        make clean
        make

    - name: Package release
      run: |
        mkdir -p release/${{ matrix.artifact_name }}/lib
        mkdir -p release/${{ matrix.artifact_name }}/include
        mkdir -p release/${{ matrix.artifact_name }}/include/themes
        cp ${{ matrix.lib_static }} release/${{ matrix.artifact_name }}/lib/
        cp ${{ matrix.lib_shared }} release/${{ matrix.artifact_name }}/lib/
        cp include/streamlog.hpp release/${{ matrix.artifact_name }}/include/
        cp include/themes/*.hpp release/${{ matrix.artifact_name }}/include/themes/
        cp README.md release/${{ matrix.artifact_name }}/
        cd release
        tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

    - name: Upload Release Asset
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.artifact_name }}
        path: release/${{ matrix.artifact_name }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/streamlog-linux-x86_64/streamlog-linux-x86_64.tar.gz
          artifacts/streamlog-macos-x86_64/streamlog-macos-x86_64.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
